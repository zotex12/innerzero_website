<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>InnerZero blog schedule</title>
  <meta name="viewport" content="width=1200" />
  <style>
    /* Theme tokens */
    :root[data-theme="dark"] {
      --bg: #0a0a0b;
      --fg: #e5e7eb;
      --fg-muted: #9ca3af;
      --fg-dim: #6b7280;
      --surface: #18181b;
      --surface-hi: #27272a;
      --border: #27272a;
      --border-hi: #3f3f46;
      --accent: #f59e0b;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
      --grey: #6b7280;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #111827;
      --fg-muted: #4b5563;
      --fg-dim: #6b7280;
      --surface: #f9fafb;
      --surface-hi: #f3f4f6;
      --border: #e5e7eb;
      --border-hi: #d1d5db;
      --accent: #d97706;
      --green: #059669;
      --orange: #d97706;
      --red: #dc2626;
      --grey: #6b7280;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Lexend', system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: var(--fg); }

    .topbar {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .stats {
      display: flex;
      gap: 18px;
      font-size: 14px;
      color: var(--fg-muted);
    }

    .stats .stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stats .num {
      font-size: 18px;
      font-weight: 600;
      color: var(--fg);
    }

    .stats .num-published { color: var(--green); }
    .stats .num-scheduled { color: var(--orange); }
    .stats .num-overdue { color: var(--red); }
    .stats .num-errors { color: var(--red); }

    .nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .month-label {
      font-size: 16px;
      font-weight: 500;
      min-width: 9.5em;
      text-align: center;
    }

    button {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    button:hover { background: var(--surface-hi); border-color: var(--border-hi); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .icon-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Calendar grid */
    .grid-wrap {
      padding: 18px 24px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }

    .weekday {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg-muted);
      padding: 4px 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 130px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day-other { opacity: 0.45; }
    .day-today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .day-num {
      font-size: 16px;
      font-weight: 500;
      color: var(--fg-muted);
      margin-bottom: 4px;
    }

    .day-today .day-num {
      color: var(--accent);
      font-weight: 600;
    }

    /* Post chips */
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--surface-hi);
      border-left: 4px solid var(--grey);
      font-size: 13px;
      cursor: pointer;
      transition: transform 100ms ease, box-shadow 100ms ease;
      user-select: none;
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chip-published { border-left-color: var(--green); }
    .chip-scheduled { border-left-color: var(--orange); }
    .chip-overdue { border-left-color: var(--red); }
    .chip-draft { border-left-color: var(--grey); }
    .chip-error {
      border-left-color: var(--red);
      background-image: repeating-linear-gradient(
        135deg,
        transparent 0,
        transparent 6px,
        rgba(239, 68, 68, 0.08) 6px,
        rgba(239, 68, 68, 0.08) 12px
      );
    }

    .chip-icon {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chip-icon.icon-published { color: var(--green); }
    .chip-icon.icon-scheduled { color: var(--orange); }
    .chip-icon.icon-overdue { color: var(--red); }
    .chip-icon.icon-error { color: var(--red); }
    .chip-icon.icon-draft { color: var(--grey); }

    .chip-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* Detail panel */
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 90vw;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform 180ms ease;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel.is-open { transform: translateX(0); }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
    }
    .badge-published { color: var(--green); border-color: var(--green); }
    .badge-scheduled { color: var(--orange); border-color: var(--orange); }
    .badge-overdue { color: var(--red); border-color: var(--red); }
    .badge-error { color: var(--red); border-color: var(--red); }
    .badge-draft { color: var(--grey); border-color: var(--grey); }

    .panel-row {
      margin: 12px 0;
      font-size: 13px;
      color: var(--fg-muted);
    }
    .panel-row .label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 4px;
    }
    .panel-row .value {
      color: var(--fg);
      font-size: 13px;
      word-break: break-word;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-hi);
      border: 1px solid var(--border);
      color: var(--fg-muted);
    }

    .panel-actions {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .panel-actions button { flex: 1; }
    .panel-actions button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .errors-list {
      color: var(--red);
      font-size: 13px;
      padding-left: 18px;
      margin: 0;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--fg-muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      margin: 18px 0;
    }

    /* Visually hidden helper for SR-only labels */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">InnerZero blog schedule</div>
    <div class="stats" id="stats">
      <span class="stat"><span class="num num-published" id="stat-published">0</span> published</span>
      <span class="stat"><span class="num num-scheduled" id="stat-scheduled">0</span> scheduled</span>
      <span class="stat"><span class="num num-overdue" id="stat-overdue">0</span> overdue</span>
      <span class="stat"><span class="num num-errors" id="stat-errors">0</span> errors</span>
    </div>

    <div class="nav">
      <button class="icon-btn" id="nav-prev" title="Previous month" aria-label="Previous month">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button id="nav-today" title="Jump to today">Today</button>
      <span class="month-label" id="month-label">Loading</span>
      <button class="icon-btn" id="nav-next" title="Next month" aria-label="Next month">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button id="btn-refresh" title="Refresh data">Refresh</button>
      <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
    </div>
  </header>

  <main class="grid-wrap">
    <div id="empty-state" class="empty" hidden>
      No posts found. Check that the script can read <code>src/content/blog/</code> and <code>blog-queue/</code>.
    </div>
    <div class="weekdays" id="weekdays" aria-hidden="true"></div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-head">
      <div class="panel-title" id="panel-title">Select a post</div>
      <button class="icon-btn" id="panel-close" title="Close" aria-label="Close panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-actions">
      <button id="btn-live" disabled>Open live URL</button>
      <button id="btn-vscode" disabled>Edit in VS Code</button>
    </div>
  </aside>

  <script>
    // Inline SVG icons for chip status (no emojis, no icon library).
    const ICONS = {
      published: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
      scheduled: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      overdue: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      error: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      draft: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>',
    };

    const STATUS_LABEL = {
      published: 'Published',
      scheduled: 'Scheduled',
      overdue: 'Overdue',
      error: 'Error',
      draft: 'Draft',
    };

    const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    let posts = [];
    let postsByDate = new Map();
    let currentYear, currentMonth; // 0-indexed month
    let selectedPost = null;

    function init() {
      // Theme: load from localStorage, default dark
      const savedTheme = localStorage.getItem('blog-scheduler-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // Render weekday header once
      const w = document.getElementById('weekdays');
      WEEKDAYS.forEach((label) => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = label;
        w.appendChild(el);
      });

      const today = new Date();
      currentYear = today.getFullYear();
      currentMonth = today.getMonth();

      document.getElementById('nav-prev').addEventListener('click', () => shiftMonth(-1));
      document.getElementById('nav-next').addEventListener('click', () => shiftMonth(1));
      document.getElementById('nav-today').addEventListener('click', () => {
        const t = new Date();
        currentYear = t.getFullYear();
        currentMonth = t.getMonth();
        renderCalendar();
      });
      document.getElementById('btn-refresh').addEventListener('click', refresh);
      document.getElementById('btn-theme').addEventListener('click', toggleTheme);
      document.getElementById('panel-close').addEventListener('click', closePanel);
      document.getElementById('btn-live').addEventListener('click', openLive);
      document.getElementById('btn-vscode').addEventListener('click', openVscode);

      window.addEventListener('focus', refresh);
      window.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') closePanel();
      });

      refresh();
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('blog-scheduler-theme', next);
    }

    function shiftMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear -= 1;
      } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear += 1;
      }
      renderCalendar();
    }

    async function refresh() {
      try {
        const resp = await fetch('/api/posts', { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        posts = data.posts || [];
        rebuildIndex();
        renderStats(data.stats || {});
        renderCalendar();
        document.getElementById('empty-state').hidden = posts.length > 0;
      } catch (e) {
        console.error('Failed to fetch /api/posts:', e);
        document.getElementById('empty-state').hidden = false;
      }
    }

    function rebuildIndex() {
      postsByDate = new Map();
      for (const p of posts) {
        if (!p.date) continue;
        if (!postsByDate.has(p.date)) postsByDate.set(p.date, []);
        postsByDate.get(p.date).push(p);
      }
    }

    function renderStats(stats) {
      const get = (id) => document.getElementById(id);
      get('stat-published').textContent = stats.published || 0;
      get('stat-scheduled').textContent = stats.scheduled || 0;
      get('stat-overdue').textContent = stats.overdue || 0;
      get('stat-errors').textContent = stats.errors || 0;
    }

    function monthName(year, monthIndex) {
      return new Date(year, monthIndex, 1).toLocaleDateString('en-GB', {
        month: 'long', year: 'numeric',
      });
    }

    function ymd(year, monthIndex, day) {
      const m = String(monthIndex + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    function renderCalendar() {
      document.getElementById('month-label').textContent = monthName(currentYear, currentMonth);

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      // ISO week start (Monday). JS getDay: 0=Sun, 1=Mon, ..., 6=Sat.
      const first = new Date(currentYear, currentMonth, 1);
      // Convert to ISO weekday index where Mon=0..Sun=6
      const firstWeekdayIso = (first.getDay() + 6) % 7;

      // Day-before this month, used to compute leading days from the
      // previous month so the grid starts on Monday.
      const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();

      // Build a flat list of 42 day cells (6 rows x 7 cols).
      const cells = [];
      for (let i = 0; i < firstWeekdayIso; i++) {
        const day = prevMonthLastDay - firstWeekdayIso + 1 + i;
        const date = new Date(currentYear, currentMonth - 1, day);
        cells.push({ date, otherMonth: true });
      }
      const thisMonthDays = new Date(currentYear, currentMonth + 1, 0).getDate();
      for (let day = 1; day <= thisMonthDays; day++) {
        cells.push({ date: new Date(currentYear, currentMonth, day), otherMonth: false });
      }
      let trailing = 1;
      while (cells.length % 7 !== 0 || cells.length < 42) {
        cells.push({ date: new Date(currentYear, currentMonth + 1, trailing), otherMonth: true });
        trailing++;
        if (cells.length >= 42) break;
      }

      const todayKey = ymd(
        new Date().getFullYear(),
        new Date().getMonth(),
        new Date().getDate()
      );

      for (const cell of cells) {
        const div = document.createElement('div');
        div.className = 'day' + (cell.otherMonth ? ' day-other' : '');
        const key = ymd(cell.date.getFullYear(), cell.date.getMonth(), cell.date.getDate());
        if (key === todayKey) div.classList.add('day-today');

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = String(cell.date.getDate());
        div.appendChild(num);

        const dayPosts = postsByDate.get(key) || [];
        for (const post of dayPosts) {
          div.appendChild(renderChip(post));
        }
        grid.appendChild(div);
      }
    }

    function truncate(text, n) {
      if (!text) return '';
      if (text.length <= n) return text;
      return text.slice(0, n - 1).trimEnd() + '…';
    }

    function renderChip(post) {
      const chip = document.createElement('button');
      chip.className = 'chip chip-' + post.status;
      chip.type = 'button';
      chip.title = post.title || post.filename;
      chip.dataset.filename = post.filename;
      chip.tabIndex = 0;

      const icon = document.createElement('span');
      icon.className = 'chip-icon icon-' + post.status;
      icon.innerHTML = ICONS[post.status] || ICONS.error;
      chip.appendChild(icon);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'chip-title';
      titleSpan.textContent = truncate(post.title || post.filename, 28);
      chip.appendChild(titleSpan);

      const sr = document.createElement('span');
      sr.className = 'sr-only';
      sr.textContent = ' (' + STATUS_LABEL[post.status] + ')';
      chip.appendChild(sr);

      chip.addEventListener('mouseenter', () => openPanel(post));
      chip.addEventListener('focus', () => openPanel(post));
      chip.addEventListener('click', (ev) => {
        ev.preventDefault();
        openPanel(post);
        // Direct dispatch on click: published goes to live, others to VS Code.
        if (post.status === 'published' && post.live_url) {
          window.open(post.live_url, '_blank', 'noopener');
        } else if (post.vscode_url) {
          window.location.href = post.vscode_url;
        }
      });

      return chip;
    }

    function openPanel(post) {
      selectedPost = post;
      const panel = document.getElementById('panel');
      panel.classList.add('is-open');
      panel.setAttribute('aria-hidden', 'false');

      document.getElementById('panel-title').textContent = post.title || post.filename;

      const body = document.getElementById('panel-body');
      body.innerHTML = '';

      const status = document.createElement('div');
      status.className = 'panel-row';
      const badge = document.createElement('span');
      badge.className = 'badge badge-' + post.status;
      badge.textContent = STATUS_LABEL[post.status];
      status.appendChild(badge);
      body.appendChild(status);

      body.appendChild(panelRow('Date', post.date || 'unknown'));
      body.appendChild(panelRow('Slug', post.slug || '(none)'));

      if (post.tags && post.tags.length) {
        const tagRow = document.createElement('div');
        tagRow.className = 'panel-row';
        const lab = document.createElement('span');
        lab.className = 'label';
        lab.textContent = 'Tags';
        tagRow.appendChild(lab);
        const pills = document.createElement('div');
        pills.className = 'pills';
        for (const t of post.tags) {
          const p = document.createElement('span');
          p.className = 'pill';
          p.textContent = t;
          pills.appendChild(p);
        }
        tagRow.appendChild(pills);
        body.appendChild(tagRow);
      }

      if (post.description) body.appendChild(panelRow('Description', post.description));
      if (post.reading_time) body.appendChild(panelRow('Reading time', post.reading_time));
      body.appendChild(panelRow('File', post.filename));

      if (post.errors && post.errors.length) {
        const er = document.createElement('div');
        er.className = 'panel-row';
        const lab = document.createElement('span');
        lab.className = 'label';
        lab.textContent = 'Errors';
        er.appendChild(lab);
        const ul = document.createElement('ul');
        ul.className = 'errors-list';
        for (const e of post.errors) {
          const li = document.createElement('li');
          li.textContent = e;
          ul.appendChild(li);
        }
        er.appendChild(ul);
        body.appendChild(er);
      }

      const liveBtn = document.getElementById('btn-live');
      const vscodeBtn = document.getElementById('btn-vscode');
      liveBtn.disabled = post.status !== 'published' || !post.live_url;
      vscodeBtn.disabled = !post.vscode_url;
    }

    function panelRow(label, value) {
      const row = document.createElement('div');
      row.className = 'panel-row';
      const lab = document.createElement('span');
      lab.className = 'label';
      lab.textContent = label;
      row.appendChild(lab);
      const val = document.createElement('span');
      val.className = 'value';
      val.textContent = value;
      row.appendChild(val);
      return row;
    }

    function closePanel() {
      const panel = document.getElementById('panel');
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
      selectedPost = null;
    }

    function openLive() {
      if (selectedPost && selectedPost.live_url) {
        window.open(selectedPost.live_url, '_blank', 'noopener');
      }
    }

    function openVscode() {
      if (selectedPost && selectedPost.vscode_url) {
        window.location.href = selectedPost.vscode_url;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
